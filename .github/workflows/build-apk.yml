# Builds the Android APK on GitHub's runners instead of EAS (no build quota),
# signed with the same keystore EAS uses, so it installs over an EAS-built
# APK without uninstalling (the save lives in the app's data and would go with
# an uninstall). The APK is attached to a pre-release on the repo's Releases
# page — open that page on the phone to download it. See BUILD.md.
#
# One-time setup — repository secrets (Settings -> Secrets and variables ->
# Actions), from `npx eas-cli credentials -p android` -> credentials.json:
#   ANDROID_KEYSTORE_BASE64    the keystore.jks, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  keystorePassword
#   ANDROID_KEY_ALIAS          keyAlias
#   ANDROID_KEY_PASSWORD       keyPassword
name: Build APK

on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: 'Todas as arquiteturas (padrão: só arm64-v8a, o celular)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABIS: ${{ inputs.all_abis && 'armeabi-v7a,arm64-v8a,x86,x86_64' || 'arm64-v8a' }}
    steps:
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signing with anything else would make an APK that refuses to
          # install over the current one. Stop instead.
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Falta um secret de assinatura (veja o topo de build-apk.yml)"; exit 1; fi
          done

      # Above anything EAS handed out, so this installs over those APKs.
      # (Expressions cannot add, so the shell does.)
      - run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # android/ is generated, never committed (.gitignore): Continuous
      # Native Generation, the same thing EAS does before its Gradle step.
      - run: npx expo prebuild --platform android --no-install

      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - run: node scripts/ci/prepare-android-release.js "$VERSION_CODE" "$ABIS"

      - name: Gradle assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Name the APK
        run: |
          short=$(git rev-parse --short HEAD)
          mv android/app/build/outputs/apk/release/app-release.apk "nba-manager-$VERSION_CODE-$short.apk"
          echo "APK=nba-manager-$VERSION_CODE-$short.apk" >> "$GITHUB_ENV"
          echo "SHORT=$short" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_CODE }}
          name: APK ${{ env.VERSION_CODE }} (${{ github.ref_name }} @ ${{ env.SHORT }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ env.APK }}
          body: |
            Build do GitHub Actions, assinado com o keystore do EAS.
            Branch `${{ github.ref_name }}`, commit ${{ github.sha }}, ABIs `${{ env.ABIS }}`.
